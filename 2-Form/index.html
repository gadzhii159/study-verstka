<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>
    <main>
        <h1>Регистрация</h1>
        <p>Уже есть аккаунт?</p> <a href="#">Войти</a>

        <form action="#" method="get">
            <div>
                <label for="Company">Мой компания</label>
                <input type="text" name="Company" id="Company" required>
            </div>

            <div>
                <label for="Name"></label>
                <input type="text" name="Name" id="Name" placeholder="Имя" required>
            </div>

            <div>
                <label for="surname"></label>
                <input type="text" name="surname" id="surname" placeholder="Фамилия" required>
            </div>

            <div>
                <label for="E-mail"></label>
                <input type="email" name="E-mail" id="E-mail" placeholder="E-mail" required>
            </div>

            <button>Зарегистрироваться</button>

            <div>
                <input type="checkbox">
                <p>Я прочитал и принимаю</p>
                <a href="#">Условия использования</a>
            </div>
        </form>
    </main>
</body>

</html>
