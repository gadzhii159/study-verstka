<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Регистрация</h1>
        <p class="account-exists">Уже есть аккаунт? <a class="login-prompt" href="#">Войти</a></p>

        <form action="#" method="get">
            <div>
                <label for="Company"></label>
                <input type="text" name="Company" id="Company" class="company" required placeholder="Мой компания">
            </div>

            <div class="form-container">
                <label for="Name"></label>
                <input type="text" name="Name" id="Name" placeholder="Имя" required>

                <label for="surname"></label>
                <input type="text" name="surname" id="surname" placeholder="Фамилия" required>
            </div>

            <div class="e-mail">
                <label for="E-mail"></label>
                <input type="email" name="E-mail" id="E-mail" placeholder="E-mail" required>
            </div>

            <button>Зарегистрироваться</button>

            <div class="form-agreement">
                <input type="checkbox">
                <span>Я прочитал и принимаю <a href="#">Условия использования</a></span>
            </div>
        </form>
    </main>
</body>

</html>
